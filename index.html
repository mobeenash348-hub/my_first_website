<title>کاترین | فروشگاه محصولات زیبایی کره‌ای</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fffaf8;--card:#fff;--ink:#2b1f22;--mute:#8a7377;--rose:#d9506b;--rose2:#f7c9d1;--line:#f0dfe2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1214;--card:#251a1d;--ink:#f6e9ec;--mute:#b79ca2;--rose:#f07a92;--rose2:#4a2830;--line:#3a2a2e}}
:root[data-theme="dark"]{--bg:#1a1214;--card:#251a1d;--ink:#f6e9ec;--mute:#b79ca2;--rose:#f07a92;--rose2:#4a2830;--line:#3a2a2e}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.8}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.w{max-width:1100px;margin:auto;padding:0 20px}
.nav{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:1100px;margin:auto}
.logo{display:flex;align-items:center;gap:10px}
.lg{width:58px;height:58px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--rose2)}
.logo b{display:block;font-size:21px;line-height:1.1}
.logo small{display:block;letter-spacing:.3em;font-size:10px;color:var(--rose);direction:ltr}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 14px;border-radius:99px;font-size:14px}
nav a:hover{background:var(--rose2)}
nav a.cta{background:var(--rose);color:#fff}
.hero{margin:24px 0;border-radius:28px;background:linear-gradient(120deg,#fde3e8,#ffd2c2 60%,#f7a8b8);color:#3a1c25;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:20px;padding:40px}
.hero span{font-size:13px;letter-spacing:.2em;direction:ltr;display:block;opacity:.75}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.4;margin:8px 0}
.hero p{max-width:420px;margin-bottom:20px}
.hero .ph{width:100%;max-width:300px;aspect-ratio:1;object-fit:cover;justify-self:center;border-radius:150px 150px 28px 28px;box-shadow:0 12px 30px #3a1c2533}
.btn{display:inline-block;background:var(--rose);color:#fff;padding:11px 26px;border-radius:99px;border:0;font:inherit;cursor:pointer}
.hero .btn{background:#3a1c25}
.btn.o{background:none;border:1.5px solid var(--rose);color:var(--rose)}
h2{font-size:23px;margin:34px 0 14px}
h1.t{font-size:28px;margin:28px 0 10px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cat{border:1px solid var(--line);border-radius:22px;text-align:center;padding:34px 14px;color:#3a1c25;transition:transform .2s}
.cat:hover{transform:translateY(-4px)}
.cat b{display:block;font-size:19px}
.cat small{display:block;margin-top:4px;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card .im{background:#fff;aspect-ratio:1;display:grid;place-items:center}
.card img{width:100%;height:100%;object-fit:contain}
.info{padding:12px 14px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.brand{font-size:12px;color:var(--rose);direction:ltr;text-align:right;letter-spacing:.08em}
.info h3{font-size:14px;line-height:1.7}
.price{margin-top:auto;font-weight:700;padding-top:6px}
.add{margin-top:8px;background:none;border:1.5px solid var(--rose);color:var(--rose);border-radius:99px;padding:7px;font:inherit;cursor:pointer}
.add:hover{background:var(--rose);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chips a{padding:7px 18px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:14px}
.chips a.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row img{width:68px;height:68px;object-fit:contain;background:#fff;border-radius:12px}
.row .n{flex:1;font-size:14px}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:16px}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.sum div{display:flex;justify-content:space-between;padding:5px 0}
.sum .tot{font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit}
.zp{background:#ffd23f;color:#222;width:100%;margin-top:14px;font-weight:700}
.note{font-size:12.5px;color:var(--mute);margin-top:10px}
.pg p{margin-bottom:12px}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.vals div{border:1px dashed var(--line);border-radius:16px;padding:14px;text-align:center}
footer{margin-top:50px;border-top:1px solid var(--line);padding:26px 20px;text-align:center;color:var(--mute);font-size:14px}
footer nav{justify-content:center;margin-bottom:8px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,40px);background:#3a1c25;color:#fff;padding:10px 22px;border-radius:99px;opacity:0;transition:.3s;z-index:9;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:26px;text-align:center}.hero p{margin-inline:auto}.nav{justify-content:center}.two,.vals{grid-template-columns:1fr}.cats{grid-template-columns:1fr 1fr 1fr;gap:8px}.cat{padding:18px 6px}.cat b{font-size:13px}.cat small{font-size:10px}}
</style>
</head>

const $=s=>document.querySelector(s),f=n=>n.toLocaleString('fa-IR')+' تومان',pid=id=>P.find(p=>p.id==id);
let cart={};try{cart=JSON.parse(localStorage.getItem('kc')||'{}')}catch(e){}
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0),sub=()=>Object.entries(cart).reduce((s,[i,q])=>s+pid(i).p*q,0),ship=()=>sub()>1500000||!sub()?0:60000;
const save=()=>{try{localStorage.setItem('kc',JSON.stringify(cart))}catch(e){}$('#cnt').textContent=count().toLocaleString('fa-IR')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const card=p=>`<article class="card"><div class="im"><img src="${p.i}" alt="${p.n}"></div><div class="info"><div class="brand">${p.b}</div><h3>${p.n}</h3><div class="price">${f(p.p)}</div><button class="add" data-add="${p.id}">افزودن به سبد</button></div></article>`;

<h2>دسته‌بندی‌ها</h2><div class="cats">${[['skin','سرم، کرم، ضدآفتاب و پاک‌کننده','#fde3e8,#f7c9d1'],['makeup','کوشن، تینت لب و رژگونه','#ffe3d3,#ffd2c2'],['hair','شامپو، ماسک و روغن مو','#f6e3dc,#f0c9bd']].map(([k,d,g])=>`<a class="cat" style="background:linear-gradient(135deg,${g})" href="#/shop/${k}"><b>${C[k]}</b><small>${d}</small></a>`).join('')}</div>
<h2>پرفروش‌ترین‌ها</h2><div class="grid">${[16,14,15,9,3,8,13,17].map(i=>card(pid(i))).join('')}</div>`,
shop:c=>`<h1 class="t">${c?C[c]:'همه محصولات'}</h1><div class="chips"><a href="#/shop" class="${c?'':'on'}">همه</a>${Object.entries(C).map(([k,v])=>`<a href="#/shop/${k}" class="${c==k?'on':''}">${v}</a>`).join('')}</div><div class="grid">${P.filter(p=>!c||p.c==c).map(card).join('')}</div>`,
cart:()=>!count()?`<div class="box" style="margin-top:28px;text-align:center"><p>سبد خرید شما خالی است.</p><br><a class="btn" href="#/shop">رفتن به فروشگاه</a></div>`:`<h1 class="t">سبد خرید</h1><div class="two"><div class="box">${Object.entries(cart).map(([i,q])=>{const p=pid(i);return `<div class="row"><img src="${p.i}" alt=""><div class="n">${p.b} – ${p.n}<br><b>${f(p.p)}</b></div><div class="q"><button data-q="${i}:1">+</button>${q.toLocaleString('fa-IR')}<button data-q="${i}:-1">−</button></div><button class="x" data-del="${i}">✕</button></div>`}).join('')}</div>${sum(true)}</div>`,
checkout:()=>!count()?V.cart():`<h1 class="t">تسویه حساب</h1><div class="two"><form class="box" id="co"><label>نام و نام خانوادگی</label><input name="name" required><label>شماره موبایل</label><input name="phone" required pattern="09[0-9]{9}" placeholder="09123456789" dir="ltr"><label>شهر</label><input name="city" required><label>آدرس کامل</label><textarea name="addr" rows="3" required></textarea><label>کد پستی</label><input name="zip" required pattern="[0-9]{10}" dir="ltr"><button class="btn zp" type="submit">پرداخت امن با زرین‌پال</button><p class="note">با کلیک روی دکمه به درگاه امن زرین‌پال منتقل می‌شوید.</p></form>${sum(false)}</div>`,
about:()=>`<div class="pg box" style="margin-top:28px"><h1 class="t" style="margin-top:0">درباره کاترین</h1><p>کاترین فروشگاه تخصصی محصولات زیبایی کره‌ای است؛ از مراقبت پوست و آرایش تا مراقبت از مو. هدف ما این است که محصولات اورجینال و مناسب پوست شما را با قیمت منصفانه و ارسال سریع به دستتان برسانیم.</p><p>تیم ما هر محصول را قبل از عرضه بررسی می‌کند و در انتخاب روتین مناسب، همراه شماست.</p><div class="vals"><div>✓<br><b>اصالت کالا</b><br>تضمین اورجینال بودن</div><div>🚚<br><b>ارسال سریع</b><br>به سراسر کشور</div><div>💬<br><b>مشاوره</b><br>انتخاب محصول مناسب</div></div></div>`,
contact:()=>`<h1 class="t">تماس با ما</h1><div class="two"><form class="box" id="ct"><label>نام</label><input required><label>ایمیل یا موبایل</label><input required><label>پیام</label><textarea rows="5" required></textarea><button class="btn" style="margin-top:14px" type="submit">ارسال پیام</button></form><div class="box pg"><p><b>تلفن:</b> <span dir="ltr">۰۲۱-۰۰۰۰۰۰۰۰</span></p><p><b>ایمیل:</b> <span dir="ltr">info@yoursite.com</span></p><p><b>ساعت پاسخگویی:</b> شنبه تا پنج‌شنبه، ۹ تا ۱۸</p><p><b>اینستاگرام:</b> <span dir="ltr">@katrin</span></p></div></div>`};
function sum(link){const s=sub(),h=ship();return `<aside class="box sum"><div><span>جمع کالاها</span><span>${f(s)}</span></div><div><span>هزینه ارسال</span><span>${h?f(h):'رایگان'}</span></div><div class="tot"><span>مبلغ قابل پرداخت</span><span>${f(s+h)}</span></div>${link?'<a class="btn zp" style="display:block;text-align:center" href="#/checkout">ادامه و پرداخت</a><p class="note">ارسال رایگان برای خرید بالای ۱٬۵۰۰٬۰۰۰ تومان</p>':''}</aside>`}
function route(){const [,a,b]=(location.hash.slice(1)||'/').split('/');$('#app').innerHTML=a=='shop'?V.shop(C[b]?b:''):(V[a]||V.home)();scrollTo(0,0)}
async function pay(o){if(!PAY_ENDPOINT){toast('نمایشی: برای اتصال واقعی، آدرس سرور زرین‌پال را در PAY_ENDPOINT بگذارید');return}
try{const r=await fetch(PAY_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});const d=await r.json();location.href=d.url}catch(e){toast('خطا در اتصال به درگاه پرداخت')}}
document.addEventListener('click',e=>{const t=e.target;if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;save();toast('به سبد خرید اضافه شد')}
else if(t.dataset.q){const[i,d]=t.dataset.q.split(':');cart[i]=(cart[i]||0)+ +d;if(cart[i]<1)delete cart[i];save();route()}
else if(t.dataset.del){delete cart[t.dataset.del];save();route()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id=='co'){const d=Object.fromEntries(new FormData(e.target));pay({customer:d,items:cart,amount:sub()+ship()})}else{toast('پیام شما ارسال شد');e.target.reset()}});
addEventListener('hashchange',route);save();route();
</script>
</body></html>
